# Test the action with a miso release: a native project, and a browser one
# (with emscripten).  Weekly, to catch a new release of haskell-miso/cli.
name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: The release to test (a tag, or latest)
        default: latest

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # install only, to make the project
      - uses: ./
        with:
          version: ${{ inputs.version || 'latest' }}
          build: 'false'
          cache: 'false'
      - name: A native project, with a test
        run: |
          miso new hello
          cd hello
          sed -e 's/^target: browser/target: native/' miso.yml > miso.yml.new && mv miso.yml.new miso.yml
          cat >> miso.yml <<'YML'
          tests:
            pass:
              main: Pass
          YML
          cat > app/Main.hs <<'HS'
          module Main where
          main :: IO ()
          main = putStrLn "hello"
          HS
          mkdir -p test
          cat > test/Pass.hs <<'HS'
          module Pass(main) where
          main :: IO ()
          main = putStrLn "pass"
          HS
      # test: auto runs miso test, as miso.yml has tests
      - uses: ./
        id: miso
        with:
          version: ${{ inputs.version || 'latest' }}
          working-directory: hello
      - name: Outputs, and miso run
        working-directory: hello
        run: |
          echo "miso ${{ steps.miso.outputs.version }} in ${{ steps.miso.outputs.miso-home }}"
          [ -n "${{ steps.miso.outputs.version }}" ]
          [ "$(command -v miso)" = "${{ steps.miso.outputs.miso-home }}/bin/miso" ]
          [ -z "$(command -v emcc || true)" ]
          [ -x dist/pass ]
          [ "$(miso run | tail -1 | tr -d '\r')" = hello ]
      - name: A failing test
        working-directory: hello
        run: |
          cat >> miso.yml <<'YML'
            fail:
              main: Fail
          YML
          cat > test/Fail.hs <<'HS'
          module Fail(main) where
          import System.Exit
          main :: IO ()
          main = exitWith (ExitFailure 3)
          HS
      - uses: ./
        id: failing
        continue-on-error: true
        with:
          version: ${{ inputs.version || 'latest' }}
          working-directory: hello
      - name: The action fails with the failing test
        run: '[ "${{ steps.failing.outcome }}" = failure ]'

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # install only, to make the project
      - uses: ./
        with:
          version: ${{ inputs.version || 'latest' }}
          build: 'false'
          cache: 'false'
      - run: miso new counter
      - uses: ./
        with:
          version: ${{ inputs.version || 'latest' }}
          working-directory: counter
          test: test -s public/index.js
